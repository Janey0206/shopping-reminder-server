name: 定时购物提醒推送

on:
  schedule:
    # 每30分钟触发
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查并推送
        env:
          JSONBIN_ID: ${{ secrets.JSONBIN_ID }}
          JSONBIN_KEY: ${{ secrets.JSONBIN_KEY }}
        run: node scripts/push.js
