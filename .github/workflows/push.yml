name: 定时购物提醒推送

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查并推送
        env:
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: node scripts/push.js

      - name: 提交 data.json 更新
        if: success()
        run: |
          if git diff --quiet data.json; then
            echo "无变更"
          else
            git config user.name 'github-actions'
            git config user.email 'actions@github.com'
            git add data.json
            git commit -m '自动更新 lastSent'
            git push
          fi
